{% extends "basic.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<h1>Регистрация</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
        <p>
            {{ field.label_tag }}<br>
            {{ field }}
            {% if field.errors %}<span class="error">{{ field.errors.0 }}</span>{% endif %}
        </p>
    {% endfor %}
    <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
